<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <!-- Screen clipping mask with rounded corners matching the phone bezel -->
    <clipPath id="screenClip">
      <rect x="0" y="8" width="920" height="1540" rx="34" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1920" fill="#f8fafc" />

  <!-- Top Caption Band (Brand Green #059669) -->
  <rect width="1080" height="380" fill="#059669" />

  <!-- Marketing Caption -->
  <text x="540" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Hear Every Payment Aloud</text>
  <text x="540" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#d1fae5" text-anchor="middle">Instant Audio Alerts</text>

  <!-- Phone Mockup Container (No gradients, no glows) -->
  <g transform="translate(80, 380)">
    <!-- Outer phone bezel (flat dark slate #0f172a) -->
    <rect x="-8" y="0" width="936" height="1550" rx="42" fill="#0f172a" />
    
    <!-- Screen content placeholder (1080x2400 screenshot scaled into 920px width) -->
    <!-- Replace the href with a base64 data URI: data:image/png;base64,... -->
    <rect x="0" y="8" width="920" height="1540" rx="34" fill="#ffffff" />
    <text x="460" y="770" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">1080x2400 Screenshot Placement</text>
  </g>
</svg>
