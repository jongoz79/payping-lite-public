<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" fill="none">
  <!-- Device Frame (iOS Native Plain Dark) -->
  <rect width="400" height="820" rx="44" fill="#000000" stroke="#2D2D2D" stroke-width="8"/>
  
  <!-- Status Bar -->
  <text x="32" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">09:41</text>
  <text x="330" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">5G 98%</text>

  <!-- Progress Bar (Step 2 of 3) -->
  <rect x="24" y="60" width="352" height="4" rx="2" fill="#282828"/>
  <rect x="24" y="60" width="234" height="4" rx="2" fill="#007AFF"/>

  <!-- Title Block -->
  <text x="24" y="112" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">Setup Siri Shortcuts</text>
  <text x="24" y="136" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="14">Connect Apple Shortcuts to capture payments offline.</text>

  <!-- Clean Steps List -->
  <g transform="translate(24, 170)">
    <rect width="352" height="74" rx="10" fill="#1C1C1E"/>
    <text x="16" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">1. Install PayPing Helper Shortcut</text>
    <text x="16" y="48" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="12">Adds the native App Intent runner to your iPhone.</text>
    <text x="16" y="64" fill="#30D158" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">✓ Ready to install</text>
  </g>

  <g transform="translate(24, 256)">
    <rect width="352" height="150" rx="10" fill="#1C1C1E"/>
    <text x="16" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">2. Create Bank Automations</text>
    <text x="16" y="48" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="12">In the Shortcuts app &gt; Automation tab:</text>

    <g transform="translate(16, 58)">
      <rect width="320" height="24" rx="4" fill="#2C2C2E"/>
      <text x="8" y="16" fill="#D1D1D6" font-family="-apple-system, sans-serif" font-size="11">Trigger: When I receive notification from [Bank]</text>
    </g>
    <g transform="translate(16, 88)">
      <rect width="320" height="24" rx="4" fill="#2C2C2E"/>
      <text x="8" y="16" fill="#D1D1D6" font-family="-apple-system, sans-serif" font-size="11">Setting: Run Immediately (Turn off "Notify")</text>
    </g>
    <g transform="translate(16, 118)">
      <rect width="320" height="24" rx="4" fill="#2C2C2E"/>
      <text x="8" y="16" fill="#D1D1D6" font-family="-apple-system, sans-serif" font-size="11">Action: Log &amp; Speak Bank Notification</text>
    </g>
  </g>

  <g transform="translate(24, 418)">
    <rect width="352" height="64" rx="10" fill="#1C1C1E"/>
    <text x="16" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">3. Repeat for Other Bank Apps</text>
    <text x="16" y="48" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="12">Add one automation per bank or e-wallet app.</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(24, 690)">
    <rect width="352" height="50" rx="10" fill="#007AFF"/>
    <text x="176" y="31" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Add Helper Shortcut</text>
  </g>

  <text x="200" y="766" text-anchor="middle" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="12">Skip setup ›</text>
</svg>
