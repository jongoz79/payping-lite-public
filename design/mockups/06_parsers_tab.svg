<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" fill="none">
  <!-- Device Frame (Material 3 Dark) -->
  <rect width="400" height="820" rx="36" fill="#121212" stroke="#2D2D2D" stroke-width="8"/>
  
  <!-- Status Bar -->
  <text x="32" y="40" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="600">09:41</text>
  <text x="330" y="40" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">5G 98%</text>

  <!-- Screen Header -->
  <text x="20" y="76" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="20" font-weight="700">Parsers</text>
  
  <!-- Import Button -->
  <g transform="translate(300, 58)">
    <rect width="80" height="30" rx="6" fill="#2563EB"/>
    <text x="40" y="20" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">+ Import</text>
  </g>

  <!-- Explanatory Subtitle -->
  <text x="20" y="104" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">
    Parsers extract amounts and customer names from notifications.
  </text>

  <!-- Section Label -->
  <text x="20" y="138" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="700">ACTIVE PARSERS (2)</text>

  <!-- Parser Item 1 (TNG) -->
  <g transform="translate(20, 150)">
    <rect width="360" height="126" rx="8" fill="#1E1E1E" stroke="#2D2D2D"/>
    
    <text x="14" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Touch 'n Go eWallet</text>
    <text x="14" y="44" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">my.com.tngdigital.ewallet • 3 rules</text>
    <text x="14" y="60" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Last matched: 12 minutes ago</text>

    <!-- Switch Toggle -->
    <rect x="306" y="14" width="40" height="22" rx="11" fill="#2563EB"/>
    <circle cx="335" cy="25" r="8" fill="#FFFFFF"/>

    <line x1="14" y1="78" x2="346" y2="78" stroke="#282828"/>

    <!-- Action Links -->
    <text x="14" y="104" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="600">Edit</text>
    <text x="56" y="104" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="600">Test captures</text>
    <text x="156" y="104" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="600">Share .json</text>
    <text x="246" y="104" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="600">Re-parse history</text>
  </g>

  <!-- Parser Item 2 (MAE) -->
  <g transform="translate(20, 286)">
    <rect width="360" height="126" rx="8" fill="#1E1E1E" stroke="#2D2D2D"/>
    
    <text x="14" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">MAE by Maybank2u</text>
    <text x="14" y="44" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">com.maybank2u.life • 2 rules</text>
    <text x="14" y="60" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Last matched: 2 hours ago</text>

    <!-- Switch Toggle -->
    <rect x="306" y="14" width="40" height="22" rx="11" fill="#2563EB"/>
    <circle cx="335" cy="25" r="8" fill="#FFFFFF"/>

    <line x1="14" y1="78" x2="346" y2="78" stroke="#282828"/>

    <text x="14" y="104" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="600">Edit</text>
    <text x="56" y="104" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="600">Test</text>
    <text x="100" y="104" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="600">Share .json</text>
    <text x="190" y="104" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="600">Re-parse history</text>
  </g>

  <!-- Section Label -->
  <text x="20" y="434" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="700">FALLBACK PARSER</text>

  <!-- Generic Parser Config Card -->
  <g transform="translate(20, 446)">
    <rect width="360" height="114" rx="8" fill="#1E1E1E" stroke="#2D2D2D"/>
    
    <text x="14" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Generic Parser Configuration</text>
    <text x="14" y="46" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">In keywords: received, masuk, credited (6 words)</text>
    <text x="14" y="64" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Out keywords: paid, bayar, debited (4 words)</text>

    <line x1="14" y1="76" x2="346" y2="76" stroke="#282828"/>

    <text x="14" y="98" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="600">Edit Keywords &amp; Patterns</text>
    <text x="240" y="98" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="600">Reset to Default</text>
  </g>

  <!-- Bottom 5-Tab Bar -->
  <g transform="translate(0, 746)">
    <rect width="400" height="74" fill="#1E1E1E" stroke="#2D2D2D"/>
    
    <text x="40" y="36" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">Today</text>
    <text x="120" y="36" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">History</text>
    <text x="200" y="36" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">Review</text>
    <text x="280" y="36" text-anchor="middle" fill="#3B82F6" font-family="sans-serif" font-size="11" font-weight="700">Parsers</text>
    <text x="360" y="36" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">Settings</text>
  </g>
</svg>
