<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" fill="none">
  <!-- Device Frame (Neutral Material 3 Dark) -->
  <rect width="400" height="820" rx="36" fill="#121212" stroke="#2D2D2D" stroke-width="8"/>
  
  <!-- Status Bar -->
  <text x="32" y="40" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="600">09:41</text>
  <text x="330" y="40" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">5G 98%</text>

  <!-- Progress Bar (Step 2 of 4) -->
  <rect x="24" y="60" width="352" height="4" rx="2" fill="#282828"/>
  <rect x="24" y="60" width="176" height="4" rx="2" fill="#2563EB"/>

  <!-- Clean Title Block -->
  <text x="24" y="104" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="22" font-weight="700">Hear Payments Aloud</text>
  <text x="24" y="126" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="13">PayPing Lite announces payments from your banking apps.</text>

  <!-- Notification Access Demystifier Box -->
  <g transform="translate(24, 146)">
    <rect width="352" height="136" rx="8" fill="#1E1E1E" stroke="#2D2D2D"/>
    
    <text x="14" y="24" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="700">Android System Warning Notice</text>
    <text x="14" y="46" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="12">Android will show a standard system prompt:</text>
    
    <rect x="14" y="56" width="324" height="30" rx="4" fill="#282828"/>
    <text x="22" y="76" fill="#F8FAFC" font-family="monospace" font-size="11">"Allow PayPing to read all notifications?"</text>

    <text x="14" y="106" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">Our Privacy Guarantee:</text>
    <text x="14" y="122" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="11">PayPing only reads apps you select. Zero internet calls.</text>
  </g>

  <!-- Permanently Visible Restricted-Settings Guide -->
  <g transform="translate(24, 298)">
    <rect width="352" height="210" rx="8" fill="#1E1E1E" stroke="#475569"/>
    
    <text x="14" y="26" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="700">Troubleshooting: Restricted Settings (Android 13+)</text>
    <text x="14" y="46" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="12">If Notification Access is greyed out:</text>

    <g transform="translate(14, 60)">
      <text x="0" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="12">1. Open Android Settings → Apps → PayPing Lite</text>
      <text x="0" y="42" fill="#CBD5E1" font-family="sans-serif" font-size="12">2. Tap the three dots (⋮) in the top-right corner</text>
      <text x="0" y="68" fill="#CBD5E1" font-family="sans-serif" font-size="12">3. Tap "Allow restricted settings" &amp; enter PIN</text>
      <text x="0" y="94" fill="#CBD5E1" font-family="sans-serif" font-size="12">4. Return here and enable Notification Access</text>
    </g>

    <line x1="14" y1="172" x2="338" y2="172" stroke="#2D2D2D"/>
    <text x="14" y="194" fill="#3B82F6" font-family="sans-serif" font-size="11" font-weight="600">Permanently accessible in Settings → Troubleshooting</text>
  </g>

  <!-- Audio Ducking Reassurance Note -->
  <g transform="translate(24, 522)">
    <rect width="352" height="60" rx="8" fill="#1E1E1E" stroke="#2D2D2D"/>
    <text x="14" y="24" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">Audio Ducking Enabled by Default</text>
    <text x="14" y="44" fill="#94A3B8" font-family="sans-serif" font-size="11">Music or radio automatically lowers volume during speech.</text>
  </g>

  <!-- Primary Action Button -->
  <g transform="translate(24, 690)">
    <rect width="352" height="50" rx="8" fill="#2563EB"/>
    <text x="176" y="31" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="15" font-weight="600">Enable Notification Access</text>
  </g>

  <!-- Dismiss / Skip -->
  <text x="200" y="766" text-anchor="middle" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="12">Set up later in Settings ›</text>
</svg>
