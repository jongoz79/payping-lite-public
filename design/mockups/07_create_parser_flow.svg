<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" fill="none">
  <!-- Device Frame (Material 3 Dark) -->
  <rect width="400" height="820" rx="36" fill="#121212" stroke="#2D2D2D" stroke-width="8"/>
  
  <!-- Status Bar -->
  <text x="32" y="40" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="600">09:41</text>
  <text x="330" y="40" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600">5G 98%</text>

  <!-- Screen Header -->
  <text x="20" y="76" fill="#3B82F6" font-family="sans-serif" font-size="14">Cancel</text>
  <text x="200" y="76" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, Roboto, sans-serif" font-size="16" font-weight="700">Create Parser</text>
  <text x="380" y="76" text-anchor="end" fill="#3B82F6" font-family="sans-serif" font-size="14" font-weight="700">Save</text>

  <!-- Guidance Subtitle -->
  <text x="20" y="104" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">
    Tap words in the notification to tag Amount and Customer.
  </text>

  <!-- Interactive Token Tapping Area -->
  <g transform="translate(20, 120)">
    <rect width="360" height="150" rx="8" fill="#1E1E1E" stroke="#334155"/>
    <text x="14" y="24" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700">RAW NOTIFICATION TOKENS</text>

    <!-- Token row 1 -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="56" height="26" rx="4" fill="#282828"/>
      <text x="28" y="17" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="11">You've</text>

      <rect x="62" y="0" width="68" height="26" rx="4" fill="#282828"/>
      <text x="96" y="17" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="11">received</text>

      <rect x="136" y="0" width="58" height="26" rx="4" fill="#282828"/>
      <text x="165" y="17" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="11">money!</text>

      <rect x="200" y="0" width="30" height="26" rx="4" fill="#282828"/>
      <text x="215" y="17" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="11">RM</text>

      <!-- Tagged as Amount (Green) -->
      <rect x="236" y="0" width="58" height="26" rx="4" fill="#10B981"/>
      <text x="265" y="17" text-anchor="middle" fill="#000000" font-family="monospace" font-size="11" font-weight="800">18.50</text>
    </g>

    <!-- Token row 2 -->
    <g transform="translate(14, 72)">
      <rect x="0" y="0" width="40" height="26" rx="4" fill="#282828"/>
      <text x="20" y="17" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="11">from</text>

      <!-- Tagged as Counterparty (Blue) -->
      <rect x="46" y="0" width="220" height="26" rx="4" fill="#2563EB"/>
      <text x="156" y="17" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">MOHD FAIZAL BIN ABDULLAH</text>
    </g>

    <!-- Token Tags Legend -->
    <g transform="translate(14, 118)">
      <rect x="0" y="2" width="10" height="10" rx="2" fill="#10B981"/>
      <text x="16" y="11" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">Tagged: Amount</text>

      <rect x="130" y="2" width="10" height="10" rx="2" fill="#2563EB"/>
      <text x="146" y="11" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="600">Tagged: Customer</text>
    </g>
  </g>

  <!-- Generated Rule Details -->
  <text x="20" y="296" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="700">GENERATED REGEX SPECIFICATION</text>

  <g transform="translate(20, 308)">
    <rect width="360" height="180" rx="8" fill="#1E1E1E" stroke="#2D2D2D"/>
    
    <text x="14" y="24" fill="#94A3B8" font-family="sans-serif" font-size="12">Direction:</text>
    <rect x="80" y="10" width="150" height="24" rx="4" fill="#282828"/>
    <text x="90" y="26" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">Money In (Received)</text>

    <text x="14" y="56" fill="#94A3B8" font-family="sans-serif" font-size="12">Amount regex:</text>
    <rect x="14" y="64" width="332" height="28" rx="4" fill="#282828"/>
    <text x="22" y="82" fill="#F8FAFC" font-family="monospace" font-size="11">RM\s?(?&lt;amount&gt;[\d,]+\.\d{2})</text>

    <text x="14" y="114" fill="#94A3B8" font-family="sans-serif" font-size="12">Counterparty regex:</text>
    <rect x="14" y="122" width="332" height="28" rx="4" fill="#282828"/>
    <text x="22" y="140" fill="#F8FAFC" font-family="monospace" font-size="11">from (?&lt;counterparty&gt;.+?)(?:\.|$)</text>
  </g>

  <!-- Live Conformance Verification Card -->
  <text x="20" y="514" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="700">LIVE ENGINE VERIFICATION</text>

  <g transform="translate(20, 526)">
    <rect width="360" height="96" rx="8" fill="#1E1E1E" stroke="#10B981"/>
    <text x="14" y="26" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">✓ Rule matches test notification</text>
    <text x="14" y="46" fill="#F8FAFC" font-family="sans-serif" font-size="13">Parsed: +RM 18.50 from MOHD FAIZAL BIN ABDULLAH</text>
    <text x="14" y="66" fill="#94A3B8" font-family="sans-serif" font-size="12">TTS announcement: "Received RM 18.50 from Mohd Faizal"</text>
    <text x="14" y="84" fill="#3B82F6" font-family="sans-serif" font-size="11">Will offer to re-parse past captures after saving</text>
  </g>

  <!-- Save Button -->
  <g transform="translate(20, 690)">
    <rect width="360" height="50" rx="8" fill="#2563EB"/>
    <text x="180" y="31" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">Save Parser &amp; Re-parse History</text>
  </g>
</svg>
